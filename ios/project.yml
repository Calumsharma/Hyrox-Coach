name: HYROXCoach
options:
  bundleIdPrefix: com.s9
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: DEBUG=1
targets:
  HYROXCoach:
    type: application
    platform: iOS
    sources:
      - path: HYROXCoach
    info:
      path: HYROXCoach/Info.plist
      properties:
        CFBundleDisplayName: S9
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHealthShareUsageDescription: "Reads your heart rate variability, resting heart rate, and sleep so your training block can adjust to how recovered you are."
    entitlements:
      path: HYROXCoach/HYROXCoach.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_NAME: S9
        PRODUCT_BUNDLE_IDENTIFIER: com.s9.app
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1"
