name: HYROXCoach
options:
  bundleIdPrefix: com.hyroxcoach
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: DEBUG=1
targets:
  HYROXCoach:
    type: application
    platform: iOS
    sources:
      - path: HYROXCoach
    info:
      path: HYROXCoach/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: HYROXCoach
        PRODUCT_BUNDLE_IDENTIFIER: com.hyroxcoach.app
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1"
